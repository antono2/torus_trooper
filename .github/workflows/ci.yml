name: CI

on:
  push:
    paths-ignore: ['**/*.md']
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows-setup:
    name: Fresh Windows setup from ordinary PowerShell
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Resolve tested compatibility manifest
        id: compat
        shell: bash
        run: |
          python -m unittest discover -s scripts -p 'test_*.py'
          python scripts/compatibility.py --github-output "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: antono2/vulkan
          ref: ${{ steps.compat.outputs.module_vulkan }}
          path: ci-inputs/vulkan
      - name: Install software Vulkan runtime for the graphical probe
        shell: bash
        run: bash ci-inputs/vulkan/.github/scripts/setup-vulkan-ci.sh ${{ steps.compat.outputs.ci_sdk }} ${{ steps.compat.outputs.ci_runtime }}
      - name: Test bootstrap and build from a fresh cache
        shell: powershell
        run: |
          ./scripts/test_windows_setup.ps1
          $Cache = Join-Path $env:RUNNER_TEMP 'Torus toolchain with spaces'
          ./scripts/setup_windows.ps1 -Check -CacheDirectory $Cache
          if (Test-Path $Cache) { throw 'Read-only check created a toolchain cache' }
          ./scripts/setup_windows.ps1 -CacheDirectory $Cache
          ./scripts/setup_windows.ps1 -CacheDirectory $Cache -PrepareOnly
          foreach ($Arguments in @(@('--headless', '--ticks', '600', '--no-sound', '--volume', '0'), @('--probe', '--no-sound', '--volume', '0'))) {
            $GameProcess = Start-Process -FilePath (Join-Path $PWD 'torus_trooper.exe') -ArgumentList $Arguments -WorkingDirectory $PWD -WindowStyle Hidden -PassThru
            $null = $GameProcess.Handle
            if (-not $GameProcess.WaitForExit(120000)) {
              Stop-Process -Id $GameProcess.Id -Force
              throw "Bootstrapped game timed out: $Arguments"
            }
            if ($GameProcess.ExitCode -ne 0) { throw "Bootstrapped game failed: $Arguments ($($GameProcess.ExitCode))" }
          }

  bridge:
    name: ${{ matrix.os }} C bridge
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Resolve tested compatibility manifest
        id: compat
        shell: bash
        run: python scripts/compatibility.py --github-output "$GITHUB_OUTPUT"
      - name: Install Linux audio headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Compile and run bridge probe (Linux)
        if: runner.os == 'Linux'
        run: cc -std=c99 -D_GNU_SOURCE -Iruntime runtime/audio_bridge_compile.c -o audio-bridge-probe -lpthread -ldl -lm && ./audio-bridge-probe
      - name: Compile and run bridge probe (macOS)
        if: runner.os == 'macOS'
        run: cc -std=c99 -Iruntime runtime/audio_bridge_compile.c -o audio-bridge-probe -framework CoreAudio -framework AudioToolbox -framework AudioUnit -framework CoreFoundation -lpthread -lm && ./audio-bridge-probe
      - name: Compile and run bridge probe (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $install = & $vswhere -latest -property installationPath
          & "$install\Common7\Tools\Launch-VsDevShell.ps1" -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          cl /nologo /std:c11 /Iruntime runtime/audio_bridge_compile.c /Fe:audio-bridge-probe.exe ole32.lib uuid.lib winmm.lib
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./audio-bridge-probe.exe

  v-tests:
    name: V simulation and runtime tests
    runs-on: ubuntu-24.04
    env:
      VMODULES: ${{ github.workspace }}/modules
      VULKAN_SDK: ${{ github.workspace }}/dependencies/Vulkan-Headers
      V_MACOS_V3_NO_FALLBACK: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Resolve tested compatibility manifest
        id: compat
        shell: bash
        run: python scripts/compatibility.py --github-output "$GITHUB_OUTPUT"
      - name: Check guide links
        run: python3 scripts/check_guide_links.py
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: antono2/vulkan
          ref: ${{ steps.compat.outputs.module_vulkan }}
          path: modules/antono2/vulkan
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: antono2/opencl
          ref: ${{ steps.compat.outputs.module_opencl }}
          path: modules/antono2/opencl
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: antono2/vulkan_memory_allocator
          ref: ${{ steps.compat.outputs.module_vkmemalloc }}
          path: modules/antono2/vkmemalloc
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: antono2/memory
          ref: ${{ steps.compat.outputs.module_memory }}
          path: modules/antono2/memory
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: KhronosGroup/Vulkan-Headers
          ref: ${{ steps.compat.outputs.headers }}
          path: dependencies/Vulkan-Headers
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: vlang/v
          ref: ${{ steps.compat.outputs.v }}
          path: toolchain/v
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: vlang/vc
          ref: ${{ steps.compat.outputs.vc }}
          path: toolchain/v/vc
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: vlang/tccbin
          ref: ${{ steps.compat.outputs.tcc }}
          path: toolchain/v/thirdparty/tcc
      - name: Build the pinned V3 compiler
        run: |
          # V's build registers GitHub problem matchers from its checkout. The
          # compiler does not need that side effect, and suppressing it avoids
          # a transient-path bug in setup-v.
          env -u GITHUB_JOB make -C toolchain/v local=1
          echo "$GITHUB_WORKSPACE/toolchain/v" >> "$GITHUB_PATH"
      - name: Verify the declared dependency graph
        shell: bash
        run: |
          v run scripts/check_installed_deps.vsh
          python scripts/compatibility.py --modules modules
      - name: Install native runtime dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libglfw3-dev libvulkan-dev libvulkan-volk-dev mesa-vulkan-drivers vulkan-validationlayers xvfb xdotool x11-utils bubblewrap patchelf libxxf86vm1 libx11-xcb1 ocl-icd-opencl-dev pocl-opencl-icd glslang-tools spirv-tools
      - name: Compile and validate shaders
        run: |
          python3 scripts/test_build_tools.py
          python3 scripts/build_shaders.py
      - name: Test deterministic simulation and runtime
        run: |
          python3 scripts/check_compiler_diagnostics.py -- v -cc gcc test torus_trooper_test.v
          python3 scripts/check_compiler_diagnostics.py -- v -cc gcc test font5x7 sim runtime
      - name: Compile game
        run: python3 scripts/check_compiler_diagnostics.py -- v -cc gcc -o torus_trooper .
      - name: Exercise the Linux setup with manifest pins
        run: TT_V3_TOOLCHAIN_DIR="$RUNNER_TEMP/Linux toolchain with spaces" bash scripts/build_linux_v3.sh
      - name: Run Vulkan validation smoke
        run: |
          set +e
          VK_INSTANCE_LAYERS=VK_LAYER_KHRONOS_validation timeout --signal=INT --kill-after=2s 3s xvfb-run -a ./torus_trooper --no-sound --volume 0 --test-effects > validation.log 2>&1
          status=$?
          set -e
          cat validation.log
          if [[ $status -ne 0 && $status -ne 124 ]]; then exit $status; fi
          if grep -Eiq 'validation error|vuid-|segmentation|assert|fatal' validation.log; then exit 1; fi
      - name: Compile and smoke test with TinyCC
        run: python3 scripts/check_compiler_diagnostics.py -- v -cc tcc -o torus_trooper_tcc . && ./torus_trooper_tcc --headless --ticks 120
      - name: Test OpenCL motion backend
        # V3 currently drops generic buffer typedefs in test files that do not
        # call the optional OpenCL path. Keep those declarations for this suite.
        run: python3 scripts/check_compiler_diagnostics.py -- v -no-skip-unused -d opencl_compute -cc gcc test sim
      - name: Compile OpenCL backend with TinyCC
        run: python3 scripts/check_compiler_diagnostics.py -- v -d opencl_compute -cc tcc -o torus_trooper_opencl_tcc . && ./torus_trooper_opencl_tcc --headless --ticks 120 --compute opencl | grep -F 'compute_active=opencl'
      - name: Verify deterministic OpenCL headless run
        run: xvfb-run -a env TT_OPENCL_SMOKE=1 TT_REPLAY_UI_SMOKE=1 ./scripts/check.sh
      - name: Package Linux candidate
        run: bash scripts/package_linux.sh torus-trooper-${{ steps.compat.outputs.project_version }}-linux-x86_64.tar.gz
      - name: Probe Linux package without host runtime libraries
        run: xvfb-run -a sudo --preserve-env=DISPLAY,XAUTHORITY bash scripts/test_linux_package.sh torus-trooper-${{ steps.compat.outputs.project_version }}-linux-x86_64.tar.gz
      - name: Probe package on Ubuntu 26.04 without installing GLFW
        run: |
          xvfb-run -a bash -c '
            docker run --rm --uts=host --ipc=host \
              -e DISPLAY -e XAUTHORITY=/tmp/game-xauthority \
              -v /tmp/.X11-unix:/tmp/.X11-unix:ro \
              -v "$XAUTHORITY:/tmp/game-xauthority:ro" \
              -v "$PWD/torus-trooper-${{ steps.compat.outputs.project_version }}-linux-x86_64.tar.gz:/candidate.tar.gz:ro" \
              ubuntu:26.04 bash -ec "
                apt-get update
                apt-get install -y --no-install-recommends mesa-vulkan-drivers
                if dpkg-query -W libglfw3 2>/dev/null; then exit 1; fi
                tar -xzf /candidate.tar.gz -C /tmp
                cd /tmp/torus-trooper
                ./play.sh --headless --ticks 600 --no-sound --volume 0 | grep -F checksum=490efd84cf12692f
                ./play.sh --probe --no-sound --volume 0
              "
          '
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: torus-trooper-linux-x86_64
          path: torus-trooper-${{ steps.compat.outputs.project_version }}-linux-x86_64.tar.gz
          if-no-files-found: error

  windows-v-tests:
    name: Windows V simulation and runtime tests
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      VMODULES: ${{ github.workspace }}/modules
      V_MACOS_V3_NO_FALLBACK: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Resolve tested compatibility manifest
        id: compat
        shell: bash
        run: python scripts/compatibility.py --github-output "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: antono2/vulkan
          # Exercise the currently released module layout used by `v install`.
          ref: ${{ steps.compat.outputs.module_vulkan }}
          path: modules/antono2/vulkan
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: antono2/opencl
          ref: ${{ steps.compat.outputs.module_opencl }}
          path: modules/antono2/opencl
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: antono2/vulkan_memory_allocator
          ref: ${{ steps.compat.outputs.module_vkmemalloc }}
          path: modules/antono2/vkmemalloc
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: antono2/memory
          ref: ${{ steps.compat.outputs.module_memory }}
          path: modules/antono2/memory
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: KhronosGroup/Vulkan-Headers
          ref: ${{ steps.compat.outputs.headers }}
          path: dependencies/Vulkan-Headers
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: vlang/v
          ref: ${{ steps.compat.outputs.v }}
          path: toolchain/v
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: vlang/vc
          # The newer bootstrap snapshot breaks Windows process handles:
          # https://github.com/vlang/v/issues/29251
          ref: ${{ steps.compat.outputs.vc }}
          path: toolchain/v/vc
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: zeux/volk
          ref: ${{ steps.compat.outputs.volk }}
          path: dependencies/volk
      - name: Install portable Clang MinGW
        shell: pwsh
        run: |
          $Archive = Join-Path $env:RUNNER_TEMP 'llvm-mingw.zip'
          $Uri = '${{ steps.compat.outputs.clang_url }}'
          Invoke-WebRequest -Uri $Uri -OutFile $Archive
          $ExpectedHash = '${{ steps.compat.outputs.clang_sha256 }}'
          if ((Get-FileHash $Archive -Algorithm SHA256).Hash -ne $ExpectedHash) {
            throw 'Clang MinGW archive checksum mismatch'
          }
          Expand-Archive -LiteralPath $Archive -DestinationPath (Join-Path $env:RUNNER_TEMP 'llvm-mingw')
          $ToolBin = Join-Path $env:RUNNER_TEMP 'llvm-mingw/${{ steps.compat.outputs.clang_directory }}/bin'
          $ToolBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Build the pinned V3 compiler with Clang
        shell: cmd
        working-directory: toolchain/v
        env:
          CFLAGS: -Wno-incompatible-pointer-types -Wno-incompatible-function-pointer-types
        run: makev.bat -clang --local
      - name: Add V compiler to PATH
        shell: pwsh
        run: |
          "$env:GITHUB_WORKSPACE\toolchain\v" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Verify the declared dependency graph
        shell: bash
        run: |
          v run scripts/check_installed_deps.vsh
          python scripts/compatibility.py --modules modules
      - name: Install Vulkan SDK and SwiftShader test artifacts
        shell: bash
        run: bash modules/antono2/vulkan/.github/scripts/setup-vulkan-ci.sh ${{ steps.compat.outputs.ci_sdk }} ${{ steps.compat.outputs.ci_runtime }}
      - name: Match Vulkan headers to the binding registry
        shell: pwsh
        run: |
          Copy-Item dependencies/Vulkan-Headers/include/vulkan/* (Join-Path $env:VULKAN_SDK 'Include/vulkan') -Recurse -Force
          Copy-Item dependencies/Vulkan-Headers/include/vk_video/* (Join-Path $env:VULKAN_SDK 'Include/vk_video') -Recurse -Force
      - name: Install matching Volk header
        shell: pwsh
        run: |
          $Destination = Join-Path $env:VULKAN_SDK 'Include\volk'
          New-Item -ItemType Directory -Force $Destination | Out-Null
          Copy-Item dependencies/volk/volk.h, dependencies/volk/volk.c $Destination
      - name: Resolve native binary cache identity
        id: native-cache
        shell: pwsh
        run: |
          $Commit = (& git -C $env:VCPKG_INSTALLATION_ROOT rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Cannot identify vcpkg ports revision' }
          "commit=$Commit" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          New-Item -ItemType Directory -Force (Join-Path $env:RUNNER_TEMP 'vcpkg-binary-cache') | Out-Null
      - name: Cache ABI-checked native packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/vcpkg-binary-cache
          key: windows-vcpkg-${{ steps.native-cache.outputs.commit }}-${{ hashFiles('compatibility.json') }}
      - name: Install GLFW and shader tools
        env:
          VCPKG_BINARY_SOURCES: clear;files,${{ runner.temp }}/vcpkg-binary-cache,readwrite
        shell: pwsh
        run: |
          vcpkg install glfw3:x64-mingw-static 'glslang[tools]:x64-windows' 'spirv-tools[tools]:x64-windows'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # The small Vulkan CI artifact contains runtime headers/libraries,
          # not the SDK's shader executables. Install the tools explicitly.
          $ToolsRoot = Join-Path $env:VCPKG_INSTALLATION_ROOT 'installed/x64-windows/tools'
          (Join-Path $ToolsRoot 'glslang') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          (Join-Path $ToolsRoot 'spirv-tools') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Test and build with Clang
        shell: pwsh
        run: |
          $GlfwRoot = Join-Path $env:VCPKG_INSTALLATION_ROOT 'installed/x64-mingw-static'
          $env:GLFW_INCLUDE = Join-Path $GlfwRoot 'include'
          $env:GLFW_LIB = Join-Path $GlfwRoot 'lib'
          $Executable = Join-Path $env:RUNNER_TEMP 'torus_trooper.exe'
          .\scripts\build_windows.ps1 -OutputPath $Executable -Verify
      - name: Package and probe Windows candidate
        shell: pwsh
        run: |
          $Executable = Join-Path $env:RUNNER_TEMP 'torus_trooper.exe'
          python scripts/package_windows.py torus-trooper-${{ steps.compat.outputs.project_version }}-windows-x86_64.zip $Executable
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $Extracted = Join-Path $env:RUNNER_TEMP 'torus-trooper-package'
          Expand-Archive torus-trooper-${{ steps.compat.outputs.project_version }}-windows-x86_64.zip $Extracted
          $Package = Join-Path $Extracted 'torus-trooper'
          $Probe = Start-Process -FilePath (Join-Path $Package 'torus_trooper.exe') `
            -ArgumentList @('--probe', '--no-sound', '--volume', '0') `
            -WorkingDirectory $Package -WindowStyle Hidden -PassThru
          if (-not $Probe.WaitForExit(120000)) {
            Stop-Process -Id $Probe.Id -Force
            throw 'Packaged Windows Vulkan probe timed out'
          }
          if ($Probe.ExitCode -ne 0) { throw "Packaged Windows probe failed: $($Probe.ExitCode)" }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: torus-trooper-windows-x86_64
          path: torus-trooper-${{ steps.compat.outputs.project_version }}-windows-x86_64.zip
          if-no-files-found: error

  package-consumer:
    name: Package consumer (${{ matrix.platform }})
    needs: [v-tests, windows-v-tests]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
            producer: v-tests
          - os: windows-2022
            platform: windows
            producer: windows-v-tests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout: |
            scripts/test_release_package.py
            scripts/compatibility.py
            compatibility.json
            v.mod
          sparse-checkout-cone-mode: false
      - name: Resolve consumer runtime pins
        id: compat
        shell: bash
        run: python scripts/compatibility.py --github-output "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: torus-trooper-${{ matrix.platform }}-x86_64
          path: downloads
      - name: Install Windows software Vulkan driver
        if: runner.os == 'Windows'
        shell: bash
        run: |
          curl --fail --location --retry 3 https://raw.githubusercontent.com/antono2/vulkan/refs/tags/${{ steps.compat.outputs.module_vulkan }}/.github/scripts/setup-vulkan-ci.sh --output "$RUNNER_TEMP/setup-vulkan-ci.sh"
          bash "$RUNNER_TEMP/setup-vulkan-ci.sh" ${{ steps.compat.outputs.ci_sdk }} ${{ steps.compat.outputs.ci_runtime }}
      - name: Test Windows package with runtime-only environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $Archives = @(Get-ChildItem downloads -Filter '*.zip')
          if ($Archives.Count -ne 1) { throw 'Expected exactly one package archive' }
          python scripts/test_release_package.py $Archives[0].FullName --project torus --vulkan-loader (Join-Path $env:VULKAN_SDK 'Bin/vulkan-1.dll') --logs package-smoke-logs
          if ($LASTEXITCODE -ne 0) { throw 'Windows package consumer failed' }
      - name: Test Linux package in a runtime-only Ubuntu container
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p package-smoke-logs
          docker run --rm --init -v "$PWD:/consumer" -w /consumer ubuntu:24.04 bash -euxc '
            apt-get update
            apt-get install -y --no-install-recommends python3 xvfb xauth mesa-vulkan-drivers libvulkan1 vulkan-validationlayers
            if command -v v; then exit 1; fi
            if command -v cmake; then exit 1; fi
            if command -v cc; then exit 1; fi
            if dpkg-query -W libglfw3 2>/dev/null; then exit 1; fi
            mapfile -t archives < <(find downloads -maxdepth 1 -type f \( -name "*.zip" -o -name "*.tar.gz" \))
            test "${#archives[@]}" -eq 1
            VK_INSTANCE_LAYERS=VK_LAYER_KHRONOS_validation timeout --kill-after=10s 8m xvfb-run -a python3 -u scripts/test_release_package.py "${archives[0]}" --project torus  --logs package-smoke-logs
          '
      - name: Preserve consumer logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: consumer-${{ matrix.platform }}
          path: package-smoke-logs
          if-no-files-found: warn
