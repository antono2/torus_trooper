  <g font-family="sans-serif" fill="#ecf2f0">
    <text x="866" y="151" font-size="21" font-weight="700">Shared course data</text>
    <text x="886" y="213" font-size="19">Playable boundary</text>
    <text x="886" y="239" font-size="15" fill="#a9bdc8">Cyan edges bound the walkable arc.</text>
    <text x="886" y="318" font-size="19">Tunnel slices</text>
    <text x="886" y="344" font-size="15" fill="#a9bdc8">Amber cross-sections mark depth.</text>
    <text x="886" y="423" font-size="19">Enemy positions</text>
    <text x="886" y="449" font-size="15" fill="#a9bdc8">Yellow markers occupy playable angles.</text>
    <text x="886" y="528" font-size="19">Player position</text>
    <text x="886" y="554" font-size="15" fill="#a9bdc8">Its limits use the same slice profile.</text>
  </g>
