    <path d="M68 171 C120 381 255 513 367 573 M193 222 C237 369 323 449 385 473"/>
    <path d="M808 171 C756 381 621 513 509 573 M683 222 C639 369 553 449 491 473"/>
    <path d="M438 478 L438 581"/>
