<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
  <title id="title">Annotated course view</title>
  <desc id="desc">A perspective sketch of the open tunnel showing playable borders, repeated course slices, enemies and the player ship.</desc>
  <defs>
    <linearGradient id="panel" x2="0" y2="1"><stop stop-color="#a5d4d0"/><stop offset="1" stop-color="#dcf2e7"/></linearGradient>
    <linearGradient id="depth" x2="0" y2="1"><stop stop-color="#1b2537"/><stop offset="1" stop-color="#24364b"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#f6f4ea"/></marker>
  </defs>
  <rect width="1200" height="660" fill="#111b2c"/>
  <text x="44" y="57" fill="#e9f5f2" font-family="sans-serif" font-weight="700" font-size="28">Course profile: one slice, three uses</text>
  <text x="44" y="86" fill="#b7c9d2" font-family="sans-serif" font-size="17">Perspective schematic — diagnostic colors match the optional in-game overlay</text>
  <rect x="38" y="112" width="800" height="505" rx="18" fill="url(#depth)" stroke="#40566b" stroke-width="2"/>
